# CI/CD de CONFIGURACION - Ansible y Nginx
# Filtro de paths (req. 4 del taller): este workflow SOLO se ejecuta cuando
# cambian archivos de configuracion (ansible/**) o este mismo workflow.

name: Config CI/CD (Ansible)

on:
  push:
    branches: [main]
    paths: ["ansible/**", ".github/workflows/config.yml"]
  pull_request:
    branches: [main]
    paths: ["ansible/**", ".github/workflows/config.yml"]
  workflow_dispatch:

# Endurecimiento: token sin permisos por defecto; cada job pide solo el minimo.
permissions: {}

jobs:
  # ---------------------------------------------------------------------------
  # Validaciones: se ejecutan en PR y push a main. No usan credenciales.
  # ---------------------------------------------------------------------------
  lint:
    name: Validaciones (yamllint, ansible-lint)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Aviso si aun no hay archivos de configuracion
        if: hashFiles('ansible/**') == ''
        run: echo "::warning::No hay archivos en ansible/ todavia; nada que validar."

      - name: Instalar herramientas de lint
        if: hashFiles('ansible/**') != ''
        run: pip install --quiet ansible-lint yamllint

      # Control de calidad de la configuracion: sintaxis y estilo YAML.
      - name: yamllint
        if: hashFiles('ansible/**') != ''
        run: "yamllint -d '{extends: default, rules: {line-length: disable, truthy: disable, document-start: disable}}' ansible/"

      # Control de calidad de la configuracion: buenas practicas de Ansible.
      - name: ansible-lint
        if: hashFiles('ansible/**') != ''
        run: ansible-lint -c ansible/.ansible-lint ansible/

      - name: Resumen del job (evidencias)
        if: hashFiles('ansible/**') != ''
        run: |
          {
            echo "### Config - Validaciones"
            echo ""
            echo "- yamllint: OK :white_check_mark:"
            echo "- ansible-lint: OK :white_check_mark:"
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # Aplicacion del playbook: solo en push a main (o ejecucion manual).
  # ---------------------------------------------------------------------------
  apply-config:
      name: Aplicar configuracion con Ansible (SSM)
      needs: lint
      if: github.event_name != 'pull_request'
      runs-on: ubuntu-latest
      timeout-minutes: 20
      permissions:
        contents: read
        id-token: write # OIDC: asumir el rol de AWS sin claves almacenadas.
      concurrency:
        group: bluegreen-deploy
        cancel-in-progress: false
      env:
        AWS_REGION: ${{ vars.AWS_REGION }}
      steps:
        - name: Checkout
          uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
          with:
            persist-credentials: false

        - name: Verificar variables requeridas del repositorio
          env:
            ECR_ROLE_ARN: ${{ vars.ECR_ROLE_ARN }}
            VM_INSTANCE_ID: ${{ vars.VM_INSTANCE_ID }}
            SSM_BUCKET: ${{ vars.ANSIBLE_SSM_BUCKET }}
          run: |
            set -euo pipefail
            faltan=""
            [ -n "$AWS_REGION" ]     || faltan="$faltan AWS_REGION"
            [ -n "$ECR_ROLE_ARN" ]   || faltan="$faltan ECR_ROLE_ARN"
            [ -n "$VM_INSTANCE_ID" ] || faltan="$faltan VM_INSTANCE_ID"
            [ -n "$SSM_BUCKET" ]     || faltan="$faltan ANSIBLE_SSM_BUCKET"
            if [ -n "$faltan" ]; then
              echo "::error::Faltan variables del repositorio:$faltan."
              exit 1
            fi

        - name: Configurar credenciales AWS (OIDC)
          uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
          with:
            role-to-assume: ${{ vars.ECR_ROLE_ARN }}
            aws-region: ${{ env.AWS_REGION }}

        - name: Instalar plugin de Session Manager
          run: |
            set -euo pipefail
            curl -fsSL "https://s3.amazonaws.com/session-manager-downloads/plugin/latest/ubuntu_64bit/session-manager-plugin.deb" -o /tmp/ssm-plugin.deb
            sudo dpkg -i /tmp/ssm-plugin.deb
            session-manager-plugin --version

        - name: Instalar Ansible y dependencias
          run: |
            set -euo pipefail
            pip install --quiet ansible-core boto3 botocore
            ansible-galaxy collection install -r ansible/requirements.yml

        - name: Crear inventario SSM
          env:
            VM_INSTANCE_ID: ${{ vars.VM_INSTANCE_ID }}
            SSM_BUCKET: ${{ vars.ANSIBLE_SSM_BUCKET }}
          run: |
            set -euo pipefail
            cat > ansible/inventory/ci.yml <<EOF
            all:
              hosts:
                vm1:
                  ansible_connection: amazon.aws.aws_ssm
                  ansible_host: ${VM_INSTANCE_ID}
                  ansible_aws_ssm_region: ${AWS_REGION}
                  ansible_aws_ssm_bucket_name: ${SSM_BUCKET}
                  ansible_python_interpreter: /usr/bin/python3
            EOF

        - name: Ejecutar playbook contra la VM
          env:
            ANSIBLE_CONFIG: ansible/ansible.cfg
            ANSIBLE_ROLES_PATH: ${{ github.workspace }}/ansible/roles
          run: |
            set -euo pipefail
            ansible-playbook -i ansible/inventory/ci.yml ansible/playbooks/setup.yml

        # No bloquea: en el primer arranque todavia no hay aplicacion desplegada.
        - name: Health check (informativo)
          continue-on-error: true
          env:
            VM_INSTANCE_ID: ${{ vars.VM_INSTANCE_ID }}
          run: |
            IP="$(aws ec2 describe-instances --instance-ids "$VM_INSTANCE_ID" \
              --query 'Reservations[0].Instances[0].PublicIpAddress' --output text)"
            curl -fsS --retry 3 --retry-delay 3 --retry-all-errors "http://${IP}/health" \
              || echo "::warning::/health no responde todavia (normal si la aplicacion aun no se despliega)."

        - name: Resumen del job (evidencias)
          run: |
            {
              echo "### Config - Configuracion aplicada (via SSM)"
              echo ""
              echo "- Playbook ejecutado: \`ansible/playbooks/setup.yml\`"
              echo "- Conexion: AWS Systems Manager, sin SSH"
            } >> "$GITHUB_STEP_SUMMARY"