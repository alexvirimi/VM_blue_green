---
# Verificar el endpoint de salud del contenedor levantado en el puerto check_port.
- name: "Verificar {{ health_path }} en el puerto {{ check_port }}"
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ check_port }}{{ health_path }}"
    status_code: 200
    timeout: 3
  register: _health
  until: _health.status == 200
  retries: "{{ health_retries }}"
  delay: "{{ health_delay }}"
