---
# Requiere: bluegreen_target_color. Cambia Nginx al color indicado.
# No se verifica, se utiliza luego de que el color verificado haya sido verificado
- name: Validar color destino
  ansible.builtin.assert:
    that: bluegreen_target_color in colors
    fail_msg: "Color inválido: {{ bluegreen_target_color }}"

- name: Respaldar config actual de Nginx
  ansible.builtin.copy:
    src: /etc/nginx/conf.d/app.conf
    dest: /etc/nginx/conf.d/app.conf.bak
    remote_src: true
    mode: "0644"
  become: true

- name: Escribir config apuntando a {{ bluegreen_target_color }}
  ansible.builtin.template:
    src: "{{ role_path }}/../nginx/templates/app.config.j2"
    dest: /etc/nginx/conf.d/app.conf
    mode: "0644"
  vars:
    active_color: "{{ bluegreen_target_color }}"
    active_port: "{{ colors[bluegreen_target_color] }}"
  become: true

- name: Validar sintaxis de Nginx
  ansible.builtin.command: nginx -t
  changed_when: false
  become: true
  register: bluegreen_nginx_test
  failed_when: bluegreen_nginx_test.rc != 0

- name: Recargar Nginx (sin cortar conexiones)
  ansible.builtin.systemd:
    name: nginx
    state: reloaded
  become: true

- name: Guardar color anterior
  ansible.builtin.copy:
    content: "{{ active_color }}\n"
    dest: "{{ state_dir }}/previous_color"
    mode: "0644"
  become: true
  when: active_color != bluegreen_target_color and active_color != 'none'

- name: Guardar color activo
  ansible.builtin.copy:
    content: "{{ bluegreen_target_color }}\n"
    dest: "{{ state_dir }}/active_color"
    mode: "0644"
  become: true

- name: Verificar a través de Nginx (puerto 80)
  ansible.builtin.uri:
    url: "http://127.0.0.1{{ health_path }}"
    status_code: 200
    return_content: false
  register: bluegreen_via_nginx
  until: bluegreen_via_nginx.status == 200
  retries: 5
  delay: 1
