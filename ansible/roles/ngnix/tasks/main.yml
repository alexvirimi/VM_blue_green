---
- name: Instalar Nginx
  ansible.builtin.apt:
    name: nginx
    state: present
  become: true

- name: Quitar sitio por defecto
  ansible.builtin.file:
    path: /etc/nginx/sites-enabled/default
    state: absent
  become: true
  notify: Reload nginx

- name: Configuración inicial (sin versión activa -> 503 hasta el primer deploy)
  ansible.builtin.template:
    src: app.conf.j2
    dest: /etc/nginx/conf.d/app.conf
    mode: "0644"
    force: false
  vars:
    active_color: none
    active_port: 0
  become: true
  notify: Reload nginx

- name: Nginx habilitado e iniciado
  ansible.builtin.systemd:
    name: nginx
    enabled: true
    state: started
  become: true
